apiVersion: batch/v1
kind: Job
metadata:
  name: nginx-job
  namespace: nginx
spec:
  template:
    metadata:
      name: nginx-job-pod
    spec:
      containers:
      - name: batch-container
        image: busybox
        command: ["echo", "Hello from the Kubernetes Job!"]
      restartPolicy: Never
  backoffLimit: 4